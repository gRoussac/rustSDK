name: CI/CD Image 1.6

on:
  schedule:
    - cron: '0 0 * * *' # This triggers the workflow every day at midnight UTC
  push:
    branches:
      - dev-1.6

jobs:
  nightly-build-push-dev:
    name: Nightly Build and Push Docker Image 1.6
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      # Step 3: Set up Make
      - name: Set up Make
        run: sudo apt-get install -y make

      # Step 4: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 5: Build the Docker image using 'make build 1.6'
      - name: Build Docker image for 1.6
        run: |
          make docker-build-prod
          docker tag casper-webclient:1.6 ${{ secrets.DOCKER_USERNAME }}/casper-webclient:1.6

      # Step 6: Push the Docker image to Docker Hub
      - name: Push Docker image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/casper-webclient:1.6
